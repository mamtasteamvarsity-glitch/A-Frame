<!DOCTYPE html>
<html lang="en" data-mode="day">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taj Mahal — AR View</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  </style>
</head>
<body>

  <!-- Back button -->
  <a href="index.html" class="ar-back-btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Back
  </a>

  <!-- Info button -->
  <button class="ar-info-btn" id="ar-info-toggle">&#8505;</button>
  <div class="ar-info-popup hidden" id="ar-info-popup">
    <h4>Taj Mahal — AR Mode</h4>
    <p>Point your camera at a <strong>Hiro marker</strong> to place the Taj Mahal in your environment. Use the scale controls below to resize.</p>
    <p style="margin-top:8px; opacity:0.6;">Built with A-Frame + AR.js</p>
  </div>

  <!-- Instructions (auto-hide on detection) -->
  <div class="ar-instructions" id="ar-instructions">
    📸 Point your camera at a<br/><strong>Hiro marker</strong> to begin
  </div>

  <!-- AR Scene -->
  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3"
    renderer="antialias: true; alpha: true; precision: mediump"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
  >
    <a-marker preset="hiro" id="ar-marker">
      <a-entity id="ar-taj" scale="0.3 0.3 0.3" position="0 0 0" ar-spin>

        <!-- Platform -->
        <a-box width="14" height="0.3" depth="14" position="0 0 0"
          color="#f5f0e8" material="metalness: 0.1; roughness: 0.3"></a-box>
        <a-box width="10" height="0.2" depth="10" position="0 0.25 0"
          color="#faf6ef" material="metalness: 0.15; roughness: 0.25"></a-box>

        <!-- Main building -->
        <a-box width="4" height="3" depth="4" position="0 1.85 0"
          color="#faf6ef" material="metalness: 0.08; roughness: 0.35"></a-box>

        <!-- Arches -->
        <a-box width="1.2" height="1.8" depth="0.15" position="0 1.45 2.02"
          color="#2c1810" material="shader: flat; opacity: 0.85"></a-box>
        <a-box width="1.2" height="1.8" depth="0.15" position="0 1.45 -2.02"
          color="#2c1810" material="shader: flat; opacity: 0.85"></a-box>
        <a-box width="0.15" height="1.8" depth="1.2" position="-2.02 1.45 0"
          color="#2c1810" material="shader: flat; opacity: 0.85"></a-box>
        <a-box width="0.15" height="1.8" depth="1.2" position="2.02 1.45 0"
          color="#2c1810" material="shader: flat; opacity: 0.85"></a-box>

        <!-- Dome drum -->
        <a-cylinder radius="1.8" height="0.4" position="0 3.55 0"
          color="#faf6ef" material="metalness: 0.1; roughness: 0.3"></a-cylinder>
        <!-- Main dome -->
        <a-sphere radius="1.6" theta-start="0" theta-length="90" position="0 3.95 0"
          color="#fefcf8" material="metalness: 0.15; roughness: 0.2" scale="1 1.3 1"></a-sphere>
        <!-- Finial -->
        <a-cylinder radius="0.06" height="0.8" position="0 6.15 0"
          color="#d4a843" material="metalness: 0.8; roughness: 0.15"></a-cylinder>
        <a-sphere radius="0.1" position="0 6.6 0"
          color="#d4a843" material="metalness: 0.9; roughness: 0.1"></a-sphere>

        <!-- Chattris -->
        <a-entity position="-1.7 3.35 1.7">
          <a-cylinder radius="0.3" height="0.6" color="#faf6ef"></a-cylinder>
          <a-sphere radius="0.35" position="0 0.5 0" color="#fefcf8" scale="1 1.2 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.4" position="0 1.1 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="1.7 3.35 1.7">
          <a-cylinder radius="0.3" height="0.6" color="#faf6ef"></a-cylinder>
          <a-sphere radius="0.35" position="0 0.5 0" color="#fefcf8" scale="1 1.2 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.4" position="0 1.1 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="-1.7 3.35 -1.7">
          <a-cylinder radius="0.3" height="0.6" color="#faf6ef"></a-cylinder>
          <a-sphere radius="0.35" position="0 0.5 0" color="#fefcf8" scale="1 1.2 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.4" position="0 1.1 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="1.7 3.35 -1.7">
          <a-cylinder radius="0.3" height="0.6" color="#faf6ef"></a-cylinder>
          <a-sphere radius="0.35" position="0 0.5 0" color="#fefcf8" scale="1 1.2 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.4" position="0 1.1 0" color="#d4a843"></a-cylinder>
        </a-entity>

        <!-- Minarets -->
        <a-entity position="-4 0 4">
          <a-cylinder radius="0.25" height="5.5" position="0 2.75 0" color="#faf6ef"></a-cylinder>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 3.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 4.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-sphere radius="0.28" position="0 5.7 0" color="#fefcf8" scale="1 1.3 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.5" position="0 6.2 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="4 0 4">
          <a-cylinder radius="0.25" height="5.5" position="0 2.75 0" color="#faf6ef"></a-cylinder>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 3.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 4.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-sphere radius="0.28" position="0 5.7 0" color="#fefcf8" scale="1 1.3 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.5" position="0 6.2 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="-4 0 -4">
          <a-cylinder radius="0.25" height="5.5" position="0 2.75 0" color="#faf6ef"></a-cylinder>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 3.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 4.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-sphere radius="0.28" position="0 5.7 0" color="#fefcf8" scale="1 1.3 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.5" position="0 6.2 0" color="#d4a843"></a-cylinder>
        </a-entity>
        <a-entity position="4 0 -4">
          <a-cylinder radius="0.25" height="5.5" position="0 2.75 0" color="#faf6ef"></a-cylinder>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 3.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-torus radius="0.35" radius-tubular="0.04" position="0 4.5 0" rotation="90 0 0" color="#e8e0d0"></a-torus>
          <a-sphere radius="0.28" position="0 5.7 0" color="#fefcf8" scale="1 1.3 1" theta-length="90"></a-sphere>
          <a-cylinder radius="0.03" height="0.5" position="0 6.2 0" color="#d4a843"></a-cylinder>
        </a-entity>

        <!-- Reflecting pool -->
        <a-box width="1.2" height="0.05" depth="12" position="0 0.16 -3"
          color="#4fc3f7" material="metalness: 0.8; roughness: 0.1; opacity: 0.7"></a-box>

      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Scale controls -->
  <div class="ar-controls">
    <button class="ar-ctrl-btn" id="ar-scale-down">−</button>
    <button class="ar-ctrl-btn" id="ar-scale-reset">Reset</button>
    <button class="ar-ctrl-btn" id="ar-scale-up">+</button>
  </div>

  <script>
    /* AR Spin component */
    AFRAME.registerComponent('ar-spin', {
      tick: function (t, dt) {
        this.el.object3D.rotation.y += 0.005;
      }
    });

    /* Scale controls */
    const STEP = 0.05;
    const MIN = 0.1;
    const MAX = 1.0;
    let currentScale = 0.3;
    const tajAR = document.getElementById('ar-taj');

    function setScale(s) {
      currentScale = Math.max(MIN, Math.min(MAX, s));
      if (tajAR) tajAR.setAttribute('scale', `${currentScale} ${currentScale} ${currentScale}`);
    }

    document.getElementById('ar-scale-up').addEventListener('click', () => setScale(currentScale + STEP));
    document.getElementById('ar-scale-down').addEventListener('click', () => setScale(currentScale - STEP));
    document.getElementById('ar-scale-reset').addEventListener('click', () => setScale(0.3));

    /* Hide instructions on marker detect */
    const marker = document.getElementById('ar-marker');
    const instr = document.getElementById('ar-instructions');
    if (marker && instr) {
      marker.addEventListener('markerFound', () => {
        instr.style.opacity = '0';
        setTimeout(() => instr.style.display = 'none', 500);
      });
      marker.addEventListener('markerLost', () => {
        instr.style.display = '';
        setTimeout(() => instr.style.opacity = '1', 50);
      });
    }

    /* Info toggle */
    const infoToggle = document.getElementById('ar-info-toggle');
    const infoPopup = document.getElementById('ar-info-popup');
    if (infoToggle && infoPopup) {
      infoToggle.addEventListener('click', () => {
        infoPopup.classList.toggle('hidden');
      });
    }
  </script>
</body>
</html>
