<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VR Solar System Explorer</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }

    /* ===== LOADING SCREEN ===== */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000 80%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 1s ease-out;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    #loading-screen h1 {
      font-size: 2.5em; color: #FDB813;
      text-shadow: 0 0 30px rgba(253,184,19,0.5), 0 0 60px rgba(253,184,19,0.3);
      margin-bottom: 30px; letter-spacing: 3px;
    }
    .loader-ring {
      width: 80px; height: 80px; border-radius: 50%;
      border: 4px solid rgba(253,184,19,0.15);
      border-top-color: #FDB813;
      animation: spin-loader 1s linear infinite;
    }
    @keyframes spin-loader { to { transform: rotate(360deg); } }
    #loading-screen p { color: rgba(255,255,255,0.5); margin-top: 20px; font-size: 0.9em; }

    /* ===== INFO PANEL ===== */
    #info-panel {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(30px);
      background: linear-gradient(135deg, rgba(10,10,50,0.95), rgba(0,0,0,0.9));
      color: #fff; padding: 24px 36px; border-radius: 20px;
      z-index: 999; text-align: center; max-width: 520px; width: 90%;
      backdrop-filter: blur(20px);
      border: 1px solid rgba(253,184,19,0.2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.6), 0 0 20px rgba(253,184,19,0.08);
      transition: opacity 0.6s cubic-bezier(0.4,0,0.2,1), transform 0.6s cubic-bezier(0.4,0,0.2,1);
      opacity: 0; pointer-events: none;
    }
    #info-panel.visible {
      opacity: 1; pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    #info-panel h2 {
      margin: 0 0 10px; font-size: 1.5em; letter-spacing: 1px;
      background: linear-gradient(90deg, #FDB813, #FF8C00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #info-panel .stats { display: flex; gap: 16px; justify-content: center; margin: 10px 0 12px; flex-wrap: wrap; }
    #info-panel .stat {
      background: rgba(255,255,255,0.06); padding: 6px 14px; border-radius: 10px;
      font-size: 0.75em; color: rgba(255,255,255,0.7);
    }
    #info-panel .stat strong { color: #FDB813; }
    #info-panel p { margin: 0; font-size: 0.9em; line-height: 1.65; opacity: 0.8; }

    /* ===== TITLE ===== */
    #title-overlay {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
      color: white; font-size: 1em; text-align: center; z-index: 998;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8); pointer-events: none; opacity: 0.7;
      letter-spacing: 2px; text-transform: uppercase;
    }

    /* ===== PLANET SWITCHER BUTTONS ===== */
    #planet-nav {
      position: fixed; top: 50%; right: 16px; transform: translateY(-50%);
      display: flex; flex-direction: column; gap: 6px; z-index: 998;
    }
    .nav-dot {
      width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer; transition: all 0.3s; position: relative;
    }
    .nav-dot:hover { border-color: #FDB813; transform: scale(1.4); }
    .nav-dot:hover::after {
      content: attr(data-name); position: absolute; right: 22px; top: 50%;
      transform: translateY(-50%); background: rgba(0,0,0,0.85); color: #fff;
      padding: 4px 10px; border-radius: 6px; font-size: 0.7em; white-space: nowrap;
    }

    /* ===== SPEED CONTROL ===== */
    #speed-control {
      position: fixed; bottom: 30px; left: 16px; z-index: 998;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    #speed-control label { color: rgba(255,255,255,0.5); font-size: 0.7em; text-transform: uppercase; letter-spacing: 1px; }
    #speed-slider {
      -webkit-appearance: none; width: 120px; height: 4px;
      background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
    }
    #speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #FDB813; cursor: pointer;
      box-shadow: 0 0 8px rgba(253,184,19,0.5);
    }

    /* ===== CONTROLS HINT ===== */
    #controls-hint {
      position: fixed; bottom: 30px; right: 16px;
      color: rgba(255,255,255,0.35); font-size: 0.7em;
      z-index: 998; text-align: right; line-height: 1.8;
    }

    @media (max-width: 600px) {
      #planet-nav { right: 6px; }
      .nav-dot { width: 10px; height: 10px; }
      #speed-control { bottom: 16px; left: 8px; }
      #info-panel { padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <h1>SOLAR SYSTEM</h1>
    <div class="loader-ring"></div>
    <p>Loading textures...</p>
  </div>

  <!-- HTML Overlays -->
  <div id="title-overlay">Solar System Explorer</div>

  <!-- Planet Navigation -->
  <div id="planet-nav">
    <div class="nav-dot" data-name="Sun"     data-target="sun-pivot"     style="background:#FDB813"></div>
    <div class="nav-dot" data-name="Mercury" data-target="mercury-pivot" style="background:#A0A0A0"></div>
    <div class="nav-dot" data-name="Venus"   data-target="venus-pivot"   style="background:#E8CDA0"></div>
    <div class="nav-dot" data-name="Earth"   data-target="earth-pivot"   style="background:#4488EE"></div>
    <div class="nav-dot" data-name="Mars"    data-target="mars-pivot"    style="background:#CC5533"></div>
    <div class="nav-dot" data-name="Jupiter" data-target="jupiter-pivot" style="background:#C4A46A"></div>
    <div class="nav-dot" data-name="Saturn"  data-target="saturn-pivot"  style="background:#E0C878"></div>
    <div class="nav-dot" data-name="Uranus"  data-target="uranus-pivot"  style="background:#77CCDD"></div>
    <div class="nav-dot" data-name="Neptune" data-target="neptune-pivot" style="background:#3366CC"></div>
  </div>

  <!-- Speed Control -->
  <div id="speed-control">
    <label>Orbit Speed</label>
    <input id="speed-slider" type="range" min="0" max="3" step="0.1" value="1" />
  </div>

  <div id="controls-hint">
    WASD / Arrow Keys — Move<br>
    Mouse Drag — Look Around<br>
    Click Planet — Info<br>
    Right Nav — Jump to Planet
  </div>

  <div id="info-panel">
    <h2 id="planet-name"></h2>
    <div class="stats" id="planet-stats"></div>
    <p id="planet-desc"></p>
  </div>

  <!-- ======================== A-Frame Components ======================== -->
  <script>
    // Global speed multiplier
    window.orbitSpeedMultiplier = 1;

    /* -------- ORBIT ANIMATION -------- */
    AFRAME.registerComponent('orbit-animation', {
      schema: {
        radius:  { type: 'number', default: 5 },
        speed:   { type: 'number', default: 1 },
        yOffset: { type: 'number', default: 0 },
        tilt:    { type: 'number', default: 0 }
      },
      init: function () {
        this.angle = Math.random() * Math.PI * 2;
      },
      tick: function (t, dt) {
        if (!dt) return;
        this.angle += (dt / 1000) * this.data.speed * 0.25 * window.orbitSpeedMultiplier;
        var r = this.data.radius;
        this.el.object3D.position.set(
          Math.cos(this.angle) * r,
          this.data.yOffset + Math.sin(this.data.tilt) * Math.sin(this.angle) * r * 0.05,
          Math.sin(this.angle) * r
        );
      }
    });

    /* -------- SELF SPIN -------- */
    AFRAME.registerComponent('spin', {
      schema: {
        speed: { type: 'number', default: 1 },
        axis:  { type: 'string', default: 'y' }
      },
      tick: function (t, dt) {
        if (!dt) return;
        var rot = (dt / 1000) * this.data.speed;
        if (this.data.axis === 'x') this.el.object3D.rotation.x += rot;
        else if (this.data.axis === 'z') this.el.object3D.rotation.z += rot;
        else this.el.object3D.rotation.y += rot;
      }
    });

    /* -------- GLOW PULSE -------- */
    AFRAME.registerComponent('glow-pulse', {
      schema: {
        color: { type: 'color', default: '#FDB813' },
        min:   { type: 'number', default: 0.4 },
        max:   { type: 'number', default: 1.0 },
        speed: { type: 'number', default: 2 }
      },
      tick: function (t) {
        var mesh = this.el.getObject3D('mesh');
        if (!mesh || !mesh.material) return;
        var val = this.data.min + (this.data.max - this.data.min) *
                  (0.5 + 0.5 * Math.sin(t / 1000 * this.data.speed));
        mesh.material.emissiveIntensity = val;
      }
    });

    /* -------- PLANET INFO (click) -------- */
    AFRAME.registerComponent('planet-info', {
      schema: {
        name:  { type: 'string', default: '' },
        desc:  { type: 'string', default: '' },
        stats: { type: 'string', default: '' }   // comma separated key:value pairs
      },
      init: function () {
        var data = this.data;
        this.el.addEventListener('click', function () {
          showPlanetInfo(data.name, data.desc, data.stats);
        });
      }
    });

    function showPlanetInfo(name, desc, stats) {
      var panel = document.getElementById('info-panel');
      document.getElementById('planet-name').textContent = name;
      document.getElementById('planet-desc').textContent  = desc;

      var statsEl = document.getElementById('planet-stats');
      statsEl.innerHTML = '';
      if (stats) {
        stats.split(',').forEach(function(s) {
          var parts = s.trim().split(':');
          if (parts.length === 2) {
            var div = document.createElement('div');
            div.className = 'stat';
            div.innerHTML = '<strong>' + parts[0].trim() + '</strong> ' + parts[1].trim();
            statsEl.appendChild(div);
          }
        });
      }

      panel.classList.add('visible');
      clearTimeout(window._infoPanelTimer);
      window._infoPanelTimer = setTimeout(function () {
        panel.classList.remove('visible');
      }, 8000);
    }

    /* -------- HOVER SCALE -------- */
    AFRAME.registerComponent('hover-scale', {
      schema: { factor: { type: 'number', default: 1.25 } },
      init: function () {
        var el = this.el, f = this.data.factor;
        el.addEventListener('mouseenter', function () {
          el.setAttribute('animation__hover', {
            property: 'scale', to: { x: f, y: f, z: f },
            dur: 250, easing: 'easeOutBack'
          });
        });
        el.addEventListener('mouseleave', function () {
          el.setAttribute('animation__hover', {
            property: 'scale', to: { x: 1, y: 1, z: 1 },
            dur: 250, easing: 'easeOutQuad'
          });
        });
      }
    });

    /* -------- SATURN RING -------- */
    AFRAME.registerComponent('saturn-ring', {
      schema: {
        innerRadius: { type: 'number', default: 1.4 },
        outerRadius: { type: 'number', default: 2.4 },
        color:       { type: 'color',  default: '#C4A45A' },
        opacity:     { type: 'number', default: 0.55 }
      },
      init: function () {
        var d = this.data;
        var geo = new THREE.RingGeometry(d.innerRadius, d.outerRadius, 128);
        // UV fix for proper ring texture mapping
        var pos = geo.attributes.position;
        var uv  = geo.attributes.uv;
        for (var i = 0; i < pos.count; i++) {
          var x = pos.getX(i), y = pos.getY(i);
          var dist = Math.sqrt(x*x + y*y);
          uv.setXY(i, (dist - d.innerRadius) / (d.outerRadius - d.innerRadius), 0.5);
        }
        var mat = new THREE.MeshStandardMaterial({
          color: d.color, side: THREE.DoubleSide,
          transparent: true, opacity: d.opacity,
          emissive: d.color, emissiveIntensity: 0.12,
          roughness: 0.8, metalness: 0.1
        });
        var mesh = new THREE.Mesh(geo, mat);
        mesh.rotation.x = -Math.PI / 2.1;
        this.el.object3D.add(mesh);
      }
    });

    /* -------- SUN CORONA (shader-based glow) -------- */
    AFRAME.registerComponent('sun-corona', {
      schema: {
        layers:    { type: 'number', default: 5 },
        baseSize:  { type: 'number', default: 3.2 },
        maxSize:   { type: 'number', default: 5.5 },
        color:     { type: 'color',  default: '#FDB813' }
      },
      init: function () {
        var d = this.data;
        for (var i = 0; i < d.layers; i++) {
          var t = i / (d.layers - 1);
          var r = d.baseSize + t * (d.maxSize - d.baseSize);
          var opacity = 0.12 * (1 - t * 0.7);
          var geo = new THREE.SphereGeometry(r, 32, 32);
          var mat = new THREE.MeshBasicMaterial({
            color: d.color, transparent: true, opacity: opacity,
            side: THREE.BackSide, depthWrite: false
          });
          var mesh = new THREE.Mesh(geo, mat);
          this.el.object3D.add(mesh);
        }
      }
    });

    /* -------- ORBIT LINE (THREE.js line) -------- */
    AFRAME.registerComponent('orbit-line', {
      schema: {
        radius: { type: 'number', default: 10 },
        color:  { type: 'color',  default: '#ffffff' },
        opacity:{ type: 'number', default: 0.08 }
      },
      init: function () {
        var d = this.data;
        var pts = [];
        for (var i = 0; i <= 256; i++) {
          var a = (i / 256) * Math.PI * 2;
          pts.push(new THREE.Vector3(Math.cos(a) * d.radius, 0, Math.sin(a) * d.radius));
        }
        var geo = new THREE.BufferGeometry().setFromPoints(pts);
        var mat = new THREE.LineBasicMaterial({
          color: d.color, transparent: true, opacity: d.opacity, depthWrite: false
        });
        var line = new THREE.Line(geo, mat);
        this.el.object3D.add(line);
      }
    });

    /* -------- Starfield generator (procedural) -------- */
    AFRAME.registerComponent('starfield', {
      schema: {
        count: { type: 'number', default: 6000 },
        radius:{ type: 'number', default: 300 },
        size:  { type: 'number', default: 0.6 }
      },
      init: function () {
        var d = this.data;
        var vertices = [];
        var colors = [];
        var starColors = [
          new THREE.Color(1, 1, 1),
          new THREE.Color(0.8, 0.85, 1),
          new THREE.Color(1, 0.95, 0.8),
          new THREE.Color(0.7, 0.8, 1),
          new THREE.Color(1, 0.85, 0.7)
        ];
        for (var i = 0; i < d.count; i++) {
          var theta = Math.random() * Math.PI * 2;
          var phi   = Math.acos(2 * Math.random() - 1);
          var r     = d.radius * (0.6 + Math.random() * 0.4);
          vertices.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
          );
          var c = starColors[Math.floor(Math.random() * starColors.length)];
          colors.push(c.r, c.g, c.b);
        }
        var geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        var mat = new THREE.PointsMaterial({
          size: d.size, vertexColors: true, transparent: true,
          opacity: 0.9, sizeAttenuation: true, depthWrite: false
        });
        this.el.object3D.add(new THREE.Points(geo, mat));
      }
    });

    /* -------- TWINKLING (animate star opacity) -------- */
    AFRAME.registerComponent('twinkle', {
      tick: function (t) {
        var pts = this.el.object3D.children[0];
        if (!pts || !pts.material) return;
        pts.material.opacity = 0.7 + 0.3 * Math.sin(t / 2000);
      }
    });

    /* === Speed slider hookup === */
    document.addEventListener('DOMContentLoaded', function () {
      var slider = document.getElementById('speed-slider');
      slider.addEventListener('input', function () {
        window.orbitSpeedMultiplier = parseFloat(this.value);
      });

      // Planet nav dots — fly camera to planet
      document.querySelectorAll('.nav-dot').forEach(function (dot) {
        dot.addEventListener('click', function () {
          var targetId = this.getAttribute('data-target');
          var targetEl = document.getElementById(targetId);
          if (!targetEl) return;
          var pos = new THREE.Vector3();
          targetEl.object3D.getWorldPosition(pos);
          var cam = document.getElementById('cameraRig');
          cam.setAttribute('animation__flyto', {
            property: 'position',
            to: { x: pos.x, y: pos.y + 4, z: pos.z + 8 },
            dur: 1500,
            easing: 'easeInOutQuad'
          });
        });
      });

      // Remove loading screen
      setTimeout(function () {
        var ls = document.getElementById('loading-screen');
        if (ls) { ls.classList.add('fade-out'); setTimeout(function(){ ls.remove(); }, 1200); }
      }, 2500);
    });
  </script>

  <!-- ======================== A-Frame Scene ======================== -->
  <a-scene
    vr-mode-ui="enabled: true"
    cursor="rayOrigin: mouse; fuse: false"
    raycaster="objects: .clickable"
    renderer="antialias: true; colorManagement: true; sortObjects: true"
    loading-screen="enabled: false"
    fog="type: exponential; color: #000; density: 0.002"
  >

    <!-- ===== ASSETS ===== -->
    <a-assets timeout="15000">
      <!-- Planet textures from Solar System Scope (free for educational use) -->
      <img id="tex-sun"     src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg/600px-The_Sun_by_the_Atmospheric_Imaging_Assembly_of_NASA%27s_Solar_Dynamics_Observatory_-_20100819.jpg" crossorigin="anonymous" />
      <img id="tex-mercury" src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mercury_in_true_color.jpg/600px-Mercury_in_true_color.jpg" crossorigin="anonymous" />
      <img id="tex-venus"   src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/08/Venus_from_Mariner_10.jpg/600px-Venus_from_Mariner_10.jpg" crossorigin="anonymous" />
      <img id="tex-earth"   src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/04/Solarsystemscope_texture_8k_earth_daymap.jpg/600px-Solarsystemscope_texture_8k_earth_daymap.jpg" crossorigin="anonymous" />
      <img id="tex-moon"    src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e1/FullMoon2010.jpg/600px-FullMoon2010.jpg" crossorigin="anonymous" />
      <img id="tex-mars"    src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/02/OSIRIS_Mars_true_color.jpg/600px-OSIRIS_Mars_true_color.jpg" crossorigin="anonymous" />
      <img id="tex-jupiter" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2b/Jupiter_and_its_shrunken_Great_Red_Spot.jpg/600px-Jupiter_and_its_shrunken_Great_Red_Spot.jpg" crossorigin="anonymous" />
      <img id="tex-saturn"  src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Saturn_during_Equinox.jpg/600px-Saturn_during_Equinox.jpg" crossorigin="anonymous" />
      <img id="tex-uranus"  src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Uranus2.jpg/600px-Uranus2.jpg" crossorigin="anonymous" />
      <img id="tex-neptune" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg/600px-Neptune_-_Voyager_2_%2829347980845%29_flatten_crop.jpg" crossorigin="anonymous" />
      <img id="tex-stars"   src="https://cdn.aframe.io/a-painter/images/sky.jpg" crossorigin="anonymous" />
    </a-assets>

    <!-- ===== CAMERA RIG ===== -->
    <a-entity id="cameraRig" position="0 12 30">
      <a-camera
        look-controls="pointerLockEnabled: false"
        wasd-controls="acceleration: 40"
        fov="65"
        near="0.1"
        far="1000"
      >
        <a-cursor
          color="#FDB813"
          fuse="false"
          raycaster="objects: .clickable"
          geometry="primitive: ring; radiusInner: 0.008; radiusOuter: 0.015"
          material="color: #FDB813; shader: flat; opacity: 0.8"
          animation__click="property: scale; startEvents: click; easing: easeInCubic; dur: 150; from: 0.5 0.5 0.5; to: 1 1 1"
        ></a-cursor>
      </a-camera>
    </a-entity>

    <!-- ===== SKY ===== -->
    <a-sky src="#tex-stars" rotation="0 90 0"></a-sky>

    <!-- ===== STARFIELD (procedural) ===== -->
    <a-entity starfield="count: 8000; radius: 350; size: 0.5" twinkle></a-entity>
    <a-entity starfield="count: 3000; radius: 200; size: 1.0"></a-entity>

    <!-- ===== LIGHTING ===== -->
    <a-entity light="type: ambient; color: #334; intensity: 0.6"></a-entity>
    <a-entity light="type: point; color: #FDB813; intensity: 3; distance: 180; decay: 1.2" position="0 0 0"></a-entity>
    <a-entity light="type: point; color: #FFA500; intensity: 1; distance: 80; decay: 1.8" position="0 2 0"></a-entity>

    <!-- ===== ORBIT LINES ===== -->
    <a-entity
      orbit-line="radius: 6; color: #888; opacity: 0.07"
    ></a-entity>
    <a-entity
      orbit-line="radius: 9; color: #E8CDA0; opacity: 0.06"
    ></a-entity>
    <a-entity
      orbit-line="radius: 13; color: #4488EE; opacity: 0.07"
    ></a-entity>
    <a-entity
      orbit-line="radius: 17; color: #CC5533; opacity: 0.06"
    ></a-entity>
    <a-entity
      orbit-line="radius: 24; color: #C4A46A; opacity: 0.05"
    ></a-entity>
    <a-entity
      orbit-line="radius: 32; color: #E0C878; opacity: 0.05"
    ></a-entity>
    <a-entity
      orbit-line="radius: 40; color: #77CCDD; opacity: 0.04"
    ></a-entity>
    <a-entity
      orbit-line="radius: 48; color: #3366CC; opacity: 0.04"
    ></a-entity>

    <!-- ================= SUN ================= -->
    <a-entity id="sun-pivot" position="0 0 0">
      <a-sphere
        class="clickable"
        radius="3"
        segments-width="64"
        segments-height="64"
        src="#tex-sun"
        material="shader: flat"
        spin="speed: 0.1"
        glow-pulse="color: #FDB813; min: 0.8; max: 1.0; speed: 1.2"
        hover-scale="factor: 1.08"
        planet-info="name: ☀️ The Sun;
                     desc: The Sun is a G-type main-sequence star at the center of our Solar System. It generates energy by fusing hydrogen into helium. Its corona extends millions of kilometers into space.;
                     stats: Age:4.6 Billion Yrs,Surface:5500°C,Type:G2V Star,Mass:99.86% of System"
        sun-corona="layers: 6; baseSize: 3.5; maxSize: 6; color: #FDB813"
      ></a-sphere>
    </a-entity>

    <!-- ================= MERCURY ================= -->
    <a-entity id="mercury-pivot" orbit-animation="radius: 6; speed: 4.1; yOffset: 0; tilt: 0.12">
      <a-sphere
        class="clickable"
        radius="0.35"
        segments-width="32"
        segments-height="32"
        src="#tex-mercury"
        material="roughness: 0.95; metalness: 0.15; emissive: #555; emissiveIntensity: 0.3"
        spin="speed: 0.4"
        hover-scale
        planet-info="name: ☿ Mercury;
                     desc: Mercury is the smallest and innermost planet. Its surface is heavily cratered like our Moon. Despite being closest to the Sun it is not the hottest — Venus holds that record.;
                     stats: Diameter:4879 km,Day:59 Earth Days,Year:88 Earth Days,Temp:-180 to 430°C"
      ></a-sphere>
      <a-text value="Mercury" align="center" color="#BBB" width="4" position="0 0.8 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= VENUS ================= -->
    <a-entity id="venus-pivot" orbit-animation="radius: 9; speed: 2.6; yOffset: 0.1; tilt: 0.05">
      <a-sphere
        class="clickable"
        radius="0.6"
        segments-width="32"
        segments-height="32"
        src="#tex-venus"
        material="roughness: 0.6; emissive: #776644; emissiveIntensity: 0.25"
        spin="speed: -0.2"
        hover-scale
        planet-info="name: ♀ Venus;
                     desc: Venus has a thick toxic atmosphere of CO₂ with clouds of sulfuric acid. The greenhouse effect makes it the hottest planet. It spins backwards — the Sun rises in the west!;
                     stats: Diameter:12104 km,Day:243 Earth Days,Year:225 Days,Surface:465°C"
      ></a-sphere>
      <!-- Venus atmosphere haze -->
      <a-sphere radius="0.66" material="color: #FFE8C0; transparent: true; opacity: 0.12; shader: flat; side: front"></a-sphere>
      <a-text value="Venus" align="center" color="#E8CDA0" width="4" position="0 1.1 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= EARTH ================= -->
    <a-entity id="earth-pivot" orbit-animation="radius: 13; speed: 2.0; yOffset: 0; tilt: 0.08">
      <a-sphere
        class="clickable"
        radius="0.65"
        segments-width="48"
        segments-height="48"
        src="#tex-earth"
        material="roughness: 0.45; metalness: 0.1; emissive: #223355; emissiveIntensity: 0.2"
        spin="speed: 1.5"
        hover-scale
        planet-info="name: 🌍 Earth;
                     desc: Earth is the only known planet with liquid water oceans and life. Its magnetic field protects us from solar wind. 71% of the surface is covered in water.;
                     stats: Diameter:12742 km,Moons:1,Year:365.25 Days,Atmo:N₂ + O₂"
      >
      </a-sphere>
      <!-- Earth atmosphere glow -->
      <a-sphere radius="0.72" material="color: #6699FF; transparent: true; opacity: 0.08; shader: flat; side: front"></a-sphere>
      <!-- Moon orbiting Earth -->
      <a-entity orbit-animation="radius: 1.5; speed: 5; yOffset: 0.05">
        <a-sphere radius="0.15" src="#tex-moon" segments-width="16" segments-height="16"
                  material="roughness: 1; emissive: #666; emissiveIntensity: 0.2"></a-sphere>
      </a-entity>
      <a-text value="Earth" align="center" color="#6699FF" width="4" position="0 1.2 0"
              look-at="[camera]" opacity="0.9"></a-text>
    </a-entity>

    <!-- ================= MARS ================= -->
    <a-entity id="mars-pivot" orbit-animation="radius: 17; speed: 1.4; yOffset: -0.1; tilt: 0.06">
      <a-sphere
        class="clickable"
        radius="0.45"
        segments-width="32"
        segments-height="32"
        src="#tex-mars"
        material="roughness: 0.9; emissive: #441100; emissiveIntensity: 0.25"
        spin="speed: 1.5"
        hover-scale
        planet-info="name: ♂ Mars;
                     desc: Mars has the tallest volcano (Olympus Mons — 21.9 km) and deepest canyon (Valles Marineris — 7 km deep) in the Solar System. NASA's rovers explore its surface for ancient life signs.;
                     stats: Diameter:6779 km,Moons:2,Year:687 Days,Temp:-87 to -5°C"
      ></a-sphere>
      <!-- Mars thin atmosphere -->
      <a-sphere radius="0.50" material="color: #CC8866; transparent: true; opacity: 0.06; shader: flat; side: front"></a-sphere>
      <a-text value="Mars" align="center" color="#CC5533" width="4" position="0 1.0 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= ASTEROID BELT ================= -->
    <a-entity id="asteroid-belt" position="0 0 0">
      <a-entity orbit-line="radius: 20; color: #887766; opacity: 0.04"></a-entity>
      <a-entity orbit-line="radius: 20.5; color: #887766; opacity: 0.03"></a-entity>
      <a-entity orbit-line="radius: 21; color: #887766; opacity: 0.04"></a-entity>
    </a-entity>

    <!-- ================= JUPITER ================= -->
    <a-entity id="jupiter-pivot" orbit-animation="radius: 24; speed: 0.8; yOffset: 0.2; tilt: 0.03">
      <a-sphere
        class="clickable"
        radius="1.6"
        segments-width="48"
        segments-height="48"
        src="#tex-jupiter"
        material="roughness: 0.55; emissive: #443311; emissiveIntensity: 0.2"
        spin="speed: 3"
        hover-scale="factor: 1.12"
        planet-info="name: ♃ Jupiter;
                     desc: Jupiter is a gas giant and the largest planet. Its Great Red Spot is a storm bigger than Earth that has been raging for 350+ years. It acts as a cosmic shield deflecting asteroids from the inner planets.;
                     stats: Diameter:139820 km,Moons:95,Year:11.9 Years,Great Red Spot:Bigger than Earth"
      ></a-sphere>
      <!-- Jupiter's faint ring -->
      <a-sphere radius="1.72" material="color: #AA8855; transparent: true; opacity: 0.04; shader: flat; side: front"></a-sphere>
      <a-text value="Jupiter" align="center" color="#C4A46A" width="5" position="0 2.4 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= SATURN ================= -->
    <a-entity id="saturn-pivot" orbit-animation="radius: 32; speed: 0.55; yOffset: -0.15; tilt: 0.04">
      <a-entity
        class="clickable"
        spin="speed: 2.5"
        hover-scale="factor: 1.12"
        planet-info="name: ♄ Saturn;
                     desc: Saturn's rings are made of billions of chunks of ice and rock — from tiny grains to house-sized boulders. Saturn is the least dense planet — it would float in a giant bathtub!;
                     stats: Diameter:116460 km,Moons:146,Ring Span:282000 km,Year:29.5 Earth Years"
        saturn-ring="innerRadius: 1.8; outerRadius: 3.0; color: #D4B46A; opacity: 0.5"
        rotation="0 0 8"
      >
        <a-sphere
          radius="1.25"
          segments-width="48"
          segments-height="48"
          src="#tex-saturn"
          material="roughness: 0.5; emissive: #554422; emissiveIntensity: 0.15"
        ></a-sphere>
      </a-entity>
      <a-text value="Saturn" align="center" color="#E0C878" width="5" position="0 2.2 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= URANUS ================= -->
    <a-entity id="uranus-pivot" orbit-animation="radius: 40; speed: 0.38; yOffset: 0.4; tilt: 0.1">
      <a-sphere
        class="clickable"
        radius="0.85"
        segments-width="32"
        segments-height="32"
        src="#tex-uranus"
        material="roughness: 0.35; emissive: #336666; emissiveIntensity: 0.25"
        spin="speed: -1.8; axis: z"
        hover-scale
        planet-info="name: ♅ Uranus;
                     desc: Uranus is an ice giant that rotates on its side with a 98° axial tilt — possibly from an ancient collision. Its blue-green color comes from methane absorbing red light.;
                     stats: Diameter:50724 km,Moons:27,Year:84 Earth Years,Tilt:98°"
        rotation="0 0 98"
      ></a-sphere>
      <a-sphere radius="0.92" material="color: #88DDEE; transparent: true; opacity: 0.06; shader: flat; side: front"></a-sphere>
      <a-text value="Uranus" align="center" color="#77CCDD" width="4.5" position="0 1.5 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ================= NEPTUNE ================= -->
    <a-entity id="neptune-pivot" orbit-animation="radius: 48; speed: 0.28; yOffset: -0.2; tilt: 0.06">
      <a-sphere
        class="clickable"
        radius="0.8"
        segments-width="32"
        segments-height="32"
        src="#tex-neptune"
        material="roughness: 0.35; emissive: #223366; emissiveIntensity: 0.3"
        spin="speed: 2.2"
        hover-scale
        planet-info="name: ♆ Neptune;
                     desc: Neptune has the strongest winds in the Solar System — up to 2100 km/h! Its vivid blue comes from methane. It was the first planet found by mathematical prediction rather than observation.;
                     stats: Diameter:49244 km,Moons:16,Year:165 Earth Years,Winds:2100 km/h"
      ></a-sphere>
      <a-sphere radius="0.87" material="color: #4466CC; transparent: true; opacity: 0.07; shader: flat; side: front"></a-sphere>
      <a-text value="Neptune" align="center" color="#4477DD" width="4.5" position="0 1.4 0"
              look-at="[camera]" opacity="0.8"></a-text>
    </a-entity>

    <!-- ===== DECORATIVE: Distant nebulae ===== -->
    <a-entity position="80 20 -120">
      <a-sphere radius="20" material="color: #5533AA; transparent: true; opacity: 0.03; shader: flat; side: double"></a-sphere>
      <a-sphere radius="14" material="color: #AA3388; transparent: true; opacity: 0.04; shader: flat; side: double"></a-sphere>
    </a-entity>
    <a-entity position="-100 -15 -90">
      <a-sphere radius="25" material="color: #2244AA; transparent: true; opacity: 0.025; shader: flat; side: double"></a-sphere>
      <a-sphere radius="18" material="color: #113377; transparent: true; opacity: 0.035; shader: flat; side: double"></a-sphere>
    </a-entity>
    <a-entity position="50 -30 100">
      <a-sphere radius="16" material="color: #BB4400; transparent: true; opacity: 0.02; shader: flat; side: double"></a-sphere>
    </a-entity>

  </a-scene>

</body>
</html>
