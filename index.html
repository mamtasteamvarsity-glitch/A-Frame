<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sri Harmandir Sahib — Golden Temple, Amritsar</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
*{margin:0;padding:0}
body{overflow:hidden;background:#0a0a0f;font-family:'Segoe UI',Arial,sans-serif}
#overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);cursor:pointer;transition:opacity 2s ease}
#overlay.hide{opacity:0;pointer-events:none}
#overlay .box{text-align:center;color:#fff}
#overlay h1{font-size:46px;color:#ffd700;text-shadow:0 0 60px rgba(255,215,0,.35);font-weight:300;letter-spacing:4px;margin-bottom:6px}
#overlay h2{font-size:15px;font-weight:300;opacity:.55;letter-spacing:2px;margin-bottom:28px}
#overlay .btn{display:inline-block;padding:14px 44px;border:1px solid rgba(255,215,0,.5);color:#ffd700;border-radius:40px;font-size:12px;letter-spacing:3px;text-transform:uppercase;animation:glow 2.5s ease infinite}
@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(255,215,0,.15)}50%{box-shadow:0 0 24px rgba(255,215,0,.3)}}
#hud{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:11px;background:rgba(0,0,0,.45);padding:8px 20px;border-radius:10px;pointer-events:none;z-index:10;backdrop-filter:blur(6px);letter-spacing:.5px;border:1px solid rgba(255,215,0,.12)}
#hud b{color:#ffd700}
</style>
</head>
<body>

<div id="overlay" onclick="this.classList.add('hide');initAudio()">
<div class="box">
<h1>ਸ੍ਰੀ ਹਰਿਮੰਦਰ ਸਾਹਿਬ</h1>
<h2>Sri Harmandir Sahib &mdash; The Golden Temple, Amritsar</h2>
<div class="btn">Enter the Sacred Space</div>
</div>
</div>

<div id="hud"><b>WASD</b> Walk &nbsp;&middot;&nbsp; <b>Mouse</b> Look &nbsp;&middot;&nbsp; <b>N</b> Day / Night &nbsp;&middot;&nbsp; <b>L</b> Lamps</div>

<script>
/* ══════════════════════════════════════════════
   AUDIO — soft tanpura + gentle water
   ══════════════════════════════════════════════ */
let _au=false;
function initAudio(){
  if(_au)return;_au=true;
  try{
    const C=new(window.AudioContext||window.webkitAudioContext)();
    const mg=C.createGain();mg.gain.value=0;mg.connect(C.destination);
    mg.gain.linearRampToValueAtTime(.06,C.currentTime+5);
    [130.81,196.0,261.63,392.0].forEach((f,i)=>{
      const o=C.createOscillator(),g=C.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.value=i<2?.22:.09;
      o.connect(g);g.connect(mg);o.start();
      const l=C.createOscillator(),lg=C.createGain();
      l.frequency.value=.12+i*.04;lg.gain.value=.3;
      l.connect(lg);lg.connect(o.frequency);l.start();
    });
    // gentle water noise
    const bs=4096,buf=C.createBuffer(1,C.sampleRate*4,C.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.sin(i/C.sampleRate*.8)*.15;
    const ws=C.createBufferSource();ws.buffer=buf;ws.loop=true;
    const wg=C.createGain();wg.gain.value=.012;
    const bf=C.createBiquadFilter();bf.type='lowpass';bf.frequency.value=400;
    ws.connect(bf);bf.connect(wg);wg.connect(mg);ws.start();
  }catch(e){}
}

/* ══════════════════════════════════════════════
   REALISTIC SKY SHADER — 5-band gradient
   ══════════════════════════════════════════════ */
AFRAME.registerShader('real-sky',{
  schema:{
    zenith:{type:'color',default:'#1a2a6c',is:'uniform'},
    upper:{type:'color',default:'#4a7ab5',is:'uniform'},
    mid:{type:'color',default:'#87CEEB',is:'uniform'},
    lower:{type:'color',default:'#e8c488',is:'uniform'},
    horizon:{type:'color',default:'#f5deb3',is:'uniform'},
    sunDir:{type:'vec3',default:{x:.5,y:.3,z:-.8},is:'uniform'},
    sunColor:{type:'color',default:'#fff4e0',is:'uniform'},
    sunSize:{type:'float',default:120.0,is:'uniform'},
    hazeStrength:{type:'float',default:.15,is:'uniform'}
  },
  vertexShader:`
    varying vec3 vWP;
    void main(){
      vWP=(modelMatrix*vec4(position,1.)).xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);
    }`,
  fragmentShader:`
    uniform vec3 zenith,upper,mid,lower,horizon,sunColor,sunDir;
    uniform float sunSize,hazeStrength;
    varying vec3 vWP;
    void main(){
      vec3 d=normalize(vWP);
      float h=d.y;
      // 5-band sky gradient
      vec3 c;
      if(h>0.6) c=mix(upper,zenith,smoothstep(0.6,1.0,h));
      else if(h>0.2) c=mix(mid,upper,smoothstep(0.2,0.6,h));
      else if(h>0.0) c=mix(lower,mid,smoothstep(0.0,0.2,h));
      else c=mix(horizon,lower,smoothstep(-0.1,0.0,h));
      // sun disc
      vec3 sd=normalize(sunDir);
      float sun=max(dot(d,sd),0.0);
      c+=sunColor*pow(sun,sunSize)*0.7;
      // haze near horizon
      float haze=exp(-abs(h)*4.0)*hazeStrength;
      c=mix(c,horizon,haze);
      // subtle warm scatter
      c+=sunColor*pow(max(sun,0.0),4.0)*0.06;
      gl_FragColor=vec4(c,1.0);
    }`
});

/* ══════════════════════════════════════════════
   REALISTIC WATER SHADER — PBR-like reflective
   ══════════════════════════════════════════════ */
AFRAME.registerShader('real-water',{
  schema:{
    deepColor:{type:'color',default:'#0a3d5c',is:'uniform'},
    shallowColor:{type:'color',default:'#1a7a9b',is:'uniform'},
    reflColor:{type:'color',default:'#c8a200',is:'uniform'},
    skyColor:{type:'color',default:'#87CEEB',is:'uniform'},
    time:{type:'time',is:'uniform'},
    opacity:{type:'float',default:.92,is:'uniform'},
    waveScale:{type:'float',default:1.0,is:'uniform'}
  },
  vertexShader:`
    varying vec2 vUv;
    varying vec3 vPos;
    varying vec3 vNormal;
    varying vec3 vWorldPos;
    uniform float time,waveScale;
    void main(){
      vUv=uv;
      float t=time*0.00025;
      vec3 p=position;
      // multi-octave wave displacement
      float w=sin(p.x*0.5+t*2.)*0.08*waveScale
             +cos(p.y*0.4+t*1.5)*0.06*waveScale
             +sin((p.x+p.y)*0.3+t)*0.1*waveScale
             +sin(p.x*1.2-t*3.)*0.03*waveScale
             +cos(p.y*1.5+t*2.5)*0.025*waveScale;
      p.z+=w;
      // compute displaced normal
      float dx=cos(p.x*0.5+t*2.)*0.04+cos((p.x+p.y)*0.3+t)*0.03;
      float dy=-sin(p.y*0.4+t*1.5)*0.024+cos((p.x+p.y)*0.3+t)*0.03;
      vNormal=normalize(vec3(-dx,1.0,-dy));
      vPos=p;
      vWorldPos=(modelMatrix*vec4(p,1.0)).xyz;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);
    }`,
  fragmentShader:`
    uniform vec3 deepColor,shallowColor,reflColor,skyColor;
    uniform float time,opacity;
    varying vec2 vUv;
    varying vec3 vPos,vNormal,vWorldPos;
    void main(){
      float t=time*0.0002;
      // fresnel approximation
      vec3 viewDir=normalize(cameraPosition-vWorldPos);
      float fresnel=pow(1.0-max(dot(viewDir,vNormal),0.0),3.5);
      fresnel=clamp(fresnel,0.15,0.95);
      // base water color with depth variation
      float depthFade=smoothstep(0.5,0.0,length(vUv-0.5));
      vec3 waterBase=mix(deepColor,shallowColor,depthFade*0.5+0.25);
      // caustics-like pattern
      float c1=sin(vUv.x*40.+t*3.)*cos(vUv.y*35.-t*2.);
      float c2=sin((vUv.x+vUv.y)*25.+t*1.5);
      float caustic=pow(max(c1*0.5+c2*0.5,0.0),3.0)*0.15;
      waterBase+=vec3(caustic*0.3,caustic*0.5,caustic*0.8);
      // temple golden reflection — soft rectangle in center
      float rx=smoothstep(0.22,0.38,abs(vUv.x-0.5));
      float ry=smoothstep(0.22,0.38,abs(vUv.y-0.5));
      float reflMask=1.0-max(rx,ry);
      // animate reflection distortion
      float rd=sin(vUv.x*20.+t*4.)*cos(vUv.y*18.-t*3.)*0.3;
      reflMask*=(0.35+rd*0.15);
      reflMask=max(reflMask,0.0);
      // blend reflection
      vec3 reflectedColor=mix(reflColor,reflColor*1.3,sin(t*2.)*0.5+0.5);
      // sky reflection via fresnel
      vec3 skyRefl=skyColor*0.4;
      // combine
      vec3 col=waterBase;
      col=mix(col,reflectedColor,reflMask*0.5);
      col=mix(col,skyRefl,fresnel*0.4);
      col=mix(col,reflectedColor*0.6,fresnel*reflMask*0.3);
      // specular sparkles
      float spec=pow(max(sin(vUv.x*100.+t*6.)*cos(vUv.y*90.-t*5.),0.0),24.0);
      col+=vec3(1.,.95,.7)*spec*0.2;
      // subtle edge darkening
      float edge=smoothstep(0.5,0.35,max(abs(vUv.x-.5),abs(vUv.y-.5)));
      col*=0.75+0.25*edge;
      gl_FragColor=vec4(col,opacity);
    }`,
  raw:false
});

/* ══════════════════════════════════════════════
   DAY-NIGHT SYSTEM — smooth cinematic transition
   ══════════════════════════════════════════════ */
AFRAME.registerComponent('day-night',{
  init(){
    this.phase=0; // 0=day, 1=night
    this.t=0;
    this.target=0;
    document.addEventListener('keydown',e=>{
      if(e.key==='n'||e.key==='N'){
        this.phase=1-this.phase;
        this.target=this.phase;
      }
    });
  },
  tick(_,dt){
    if(!dt)return;
    const diff=this.target-this.t;
    if(Math.abs(diff)<.002)return;
    this.t+=diff*Math.min(dt*.001,.04);
    this.t=Math.max(0,Math.min(1,this.t));
    const n=this.t;
    const lc=(a,b)=>{const ca=new THREE.Color(a),cb=new THREE.Color(b);ca.lerp(cb,n);return'#'+ca.getHexString()};
    // sky
    const sky=document.getElementById('sky');
    if(sky){
      sky.setAttribute('material','zenith',lc('#1a2a6c','#020308'));
      sky.setAttribute('material','upper',lc('#4a7ab5','#060d1e'));
      sky.setAttribute('material','mid',lc('#87CEEB','#0a1628'));
      sky.setAttribute('material','lower',lc('#e8c488','#0d1a30'));
      sky.setAttribute('material','horizon',lc('#f5deb3','#101828'));
      sky.setAttribute('material','hazeStrength',String(.15-.08*n));
      sky.setAttribute('material','sunSize',String(120-80*n));
    }
    // fog
    this.el.setAttribute('fog','color',lc('#d4c4a8','#080e18'));
    this.el.setAttribute('fog','density',String(.006+.004*n));
    // lights
    const amb=document.getElementById('amb');
    if(amb){
      amb.setAttribute('light','color',lc('#ffeedd','#1a2855'));
      amb.setAttribute('light','intensity',String(.45-.22*n));
    }
    const sun=document.getElementById('sun');
    if(sun){
      sun.setAttribute('light','color',lc('#fff4e0','#1a2244'));
      sun.setAttribute('light','intensity',String(1.2-.9*n));
      // move sun lower at night
      const sy=45-30*n;
      sun.setAttribute('position',`35 ${sy} 25`);
    }
    // temple glow
    const g1=document.getElementById('glow1');
    if(g1) g1.setAttribute('light','intensity',String(.6+2.5*n));
    const g2=document.getElementById('glow2');
    if(g2) g2.setAttribute('light','intensity',String(.25+1.8*n));
    const g3=document.getElementById('glow3');
    if(g3) g3.setAttribute('light','intensity',String(.15+1.2*n));
    // gold emissive
    document.querySelectorAll('.gld').forEach(el=>{
      el.setAttribute('material','emissiveIntensity',String(.4+.5*n));
    });
    // water
    const w=document.getElementById('water');
    if(w){
      w.setAttribute('material','deepColor',lc('#0a3d5c','#030d18'));
      w.setAttribute('material','shallowColor',lc('#1a7a9b','#081a28'));
      w.setAttribute('material','skyColor',lc('#87CEEB','#0a1628'));
    }
    // stars & moon
    const st=document.getElementById('stars');
    if(st) st.setAttribute('visible',n>.25);
    const mn=document.getElementById('moon');
    if(mn){mn.setAttribute('visible',n>.2);mn.setAttribute('material','opacity',String(Math.max(0,(n-.2)*1.3)));}
    // diyas
    document.querySelectorAll('.dflame').forEach(el=>{
      el.setAttribute('material','opacity',String(.2+.8*n));
    });
    document.querySelectorAll('.dlight').forEach(el=>{
      el.setAttribute('light','intensity',String(.05+.55*n));
    });
  }
});

/* ═══ Lamp toggle ═══ */
AFRAME.registerComponent('lamp-ctrl',{
  init(){
    this.on=true;
    document.addEventListener('keydown',e=>{
      if(e.key==='l'||e.key==='L'){
        this.on=!this.on;
        document.querySelectorAll('.diya').forEach(el=>el.setAttribute('visible',this.on));
      }
    });
  }
});

/* ═══ Bird flight ═══ */
AFRAME.registerComponent('bird-fly',{
  schema:{r:{default:35},h:{default:22},spd:{default:.1},off:{default:0}},
  tick(t){
    const d=this.data,a=t*.001*d.spd+d.off;
    const p=this.el.object3D.position;
    p.set(Math.cos(a)*d.r,d.h+Math.sin(a*2)*1.5,Math.sin(a)*d.r);
    this.el.object3D.rotation.y=-a+Math.PI/2;
    const w=this.el.querySelectorAll('.bw');
    const f=Math.sin(t*.013)*28*Math.PI/180;
    if(w[0])w[0].object3D.rotation.z=f;
    if(w[1])w[1].object3D.rotation.z=-f;
  }
});

/* ═══ Cloud drift ═══ */
AFRAME.registerComponent('cloud-move',{
  schema:{spd:{default:.08},range:{default:130}},
  tick(){
    this.el.object3D.position.x+=this.data.spd*.012;
    if(this.el.object3D.position.x>this.data.range) this.el.object3D.position.x=-this.data.range;
  }
});

/* ═══ Golden dust particles ═══ */
AFRAME.registerComponent('gold-dust',{
  init(){
    const N=400,g=new THREE.BufferGeometry();
    const p=new Float32Array(N*3),c=new Float32Array(N*3);
    for(let i=0;i<N;i++){
      p[i*3]=(Math.random()-.5)*100;p[i*3+1]=Math.random()*25+.5;p[i*3+2]=(Math.random()-.5)*100;
      const v=.75+Math.random()*.25;c[i*3]=v;c[i*3+1]=v*.85;c[i*3+2]=v*.25;
    }
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    g.setAttribute('color',new THREE.BufferAttribute(c,3));
    const m=new THREE.PointsMaterial({size:.055,transparent:true,opacity:.35,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true});
    this._p=new THREE.Points(g,m);
    this.el.object3D.add(this._p);this._d=p;this._n=N;
  },
  tick(t){
    for(let i=0;i<this._n;i++){
      this._d[i*3+1]+=.003;
      if(this._d[i*3+1]>25){this._d[i*3+1]=.5;this._d[i*3]=(Math.random()-.5)*100;}
    }
    this._p.geometry.attributes.position.needsUpdate=true;
  }
});

/* ═══ Star field ═══ */
AFRAME.registerComponent('star-field',{
  init(){
    const N=900,g=new THREE.BufferGeometry(),p=new Float32Array(N*3),s=new Float32Array(N);
    for(let i=0;i<N;i++){
      const th=Math.random()*Math.PI*2,ph=Math.acos(Math.random()*.75+.25),r=480;
      p[i*3]=r*Math.sin(ph)*Math.cos(th);p[i*3+1]=r*Math.cos(ph);p[i*3+2]=r*Math.sin(ph)*Math.sin(th);
      s[i]=.3+Math.random()*.8;
    }
    g.setAttribute('position',new THREE.BufferAttribute(p,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(s,1));
    const vsh=`attribute float aSize;varying float vS;void main(){vS=aSize;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*(300.0/length(mv.xyz));gl_Position=projectionMatrix*mv;}`;
    const fsh=`varying float vS;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=1.-smoothstep(.2,.5,d);gl_FragColor=vec4(1.,1.,.95,a*.9);}`;
    const m=new THREE.ShaderMaterial({vertexShader:vsh,fragmentShader:fsh,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    this.el.object3D.add(new THREE.Points(g,m));
  }
});

/* ═══ Flag wave ═══ */
AFRAME.registerComponent('flag-wave',{
  tick(t){
    const m=this.el.getObject3D('mesh');
    if(!m||!m.geometry)return;
    const p=m.geometry.attributes.position;
    if(!this._o)this._o=new Float32Array(p.array);
    const T=t*.0025;
    for(let i=0;i<p.count;i++){
      const ox=this._o[i*3];
      p.array[i*3+2]=this._o[i*3+2]+Math.sin(ox*3.5+T)*.12*(Math.max(ox+.5,0));
    }
    p.needsUpdate=true;
  }
});

/* ═══ Lotus bob ═══ */
AFRAME.registerComponent('lotus-bob',{
  schema:{spd:{default:.4}},
  init(){this._y=this.el.object3D.position.y;},
  tick(t){
    this.el.object3D.position.y=this._y+Math.sin(t*.001*this.data.spd)*.03;
    this.el.object3D.rotation.y+=.00015;
  }
});
</script>

<!-- ══════════════════════════════════════════════════════════
     SCENE
     ══════════════════════════════════════════════════════════ -->
<a-scene
  day-night lamp-ctrl
  vr-mode-ui="enabled:true"
  renderer="antialias:true;physicallyCorrectLights:true;colorManagement:true;
            toneMapping:ACESFilmic;toneMappingExposure:1.05;
            sortObjects:true;alpha:false"
  shadow="type:pcfsoft;autoUpdate:true"
  fog="type:exponential;color:#d4c4a8;density:0.006"
>

<!-- ════ ASSETS ════ -->
<a-assets timeout="3000">
  <a-mixin id="G" material="color:#FFD700;metalness:1;roughness:0.1;
    emissive:#c8a200;emissiveIntensity:0.4"></a-mixin>
  <a-mixin id="M" material="color:#f0ece4;metalness:0.06;roughness:0.18;
    emissive:#e2ddd0;emissiveIntensity:0.03"></a-mixin>
  <a-mixin id="DM" material="color:#a89880;roughness:0.35;metalness:0.04"></a-mixin>
  <a-mixin id="PC" material="color:#ede6d8;metalness:0.08;roughness:0.16;
    emissive:#d8d0c0;emissiveIntensity:0.02"></a-mixin>
</a-assets>

<!-- ════ SKY ════ -->
<a-sky id="sky" material="shader:real-sky;
  zenith:#1a2a6c;upper:#4a7ab5;mid:#87CEEB;lower:#e8c488;horizon:#f5deb3;
  sunDir:0.5 0.3 -0.8;sunColor:#fff4e0;sunSize:120;hazeStrength:0.15"
  radius="500"></a-sky>

<!-- ════ STARS & MOON ════ -->
<a-entity id="stars" star-field visible="false"></a-entity>
<a-entity id="moon" position="-90 100 -70" visible="false">
  <a-sphere radius="6" material="shader:flat;color:#eee8d5;opacity:0;transparent:true"></a-sphere>
  <a-sphere radius="7.5" material="shader:flat;color:#eee8d5;opacity:0;transparent:true" scale="1.2 1.2 1" position="0 0 -1"></a-sphere>
</a-entity>

<!-- ════ CLOUDS ════ -->
<a-entity cloud-move="spd:0.06;range:140" position="-70 38 -40">
  <a-sphere material="shader:flat;color:#fff;opacity:.08;transparent:true" radius="10" scale="4 .5 2"></a-sphere>
  <a-sphere material="shader:flat;color:#fff;opacity:.06;transparent:true" radius="7" scale="3 .4 1.5" position="6 1 3"></a-sphere>
</a-entity>
<a-entity cloud-move="spd:0.04;range:140" position="40 42 25">
  <a-sphere material="shader:flat;color:#fef8ea;opacity:.07;transparent:true" radius="12" scale="4.5 .45 2.2"></a-sphere>
  <a-sphere material="shader:flat;color:#fff;opacity:.05;transparent:true" radius="8" scale="3 .35 1.5" position="-7 .5 -4"></a-sphere>
</a-entity>
<a-entity cloud-move="spd:0.09;range:140" position="-25 35 55">
  <a-sphere material="shader:flat;color:#fff;opacity:.06;transparent:true" radius="11" scale="5 .4 2.5"></a-sphere>
</a-entity>

<!-- ════ LIGHTING — cinematic ════ -->
<a-entity id="amb" light="type:ambient;color:#ffeedd;intensity:0.45"></a-entity>

<a-entity id="sun" light="type:directional;color:#fff4e0;intensity:1.2;
  castShadow:true;shadowMapWidth:4096;shadowMapHeight:4096;
  shadowCameraLeft:-55;shadowCameraRight:55;shadowCameraTop:55;shadowCameraBottom:-55;
  shadowCameraNear:0.5;shadowCameraFar:180;shadowBias:-0.001;shadowRadius:3"
  position="35 45 25"></a-entity>

<!-- warm fill from opposite side -->
<a-entity light="type:directional;color:#ffe8c8;intensity:0.2" position="-30 25 -20"></a-entity>

<!-- temple glow lights -->
<a-entity id="glow1" light="type:point;color:#FFD700;intensity:0.6;distance:60;decay:1.0" position="0 10 0"></a-entity>
<a-entity id="glow2" light="type:point;color:#ffaa33;intensity:0.25;distance:45;decay:1.5" position="0 3.5 0"></a-entity>
<a-entity id="glow3" light="type:point;color:#ffc97a;intensity:0.15;distance:35;decay:1.8" position="0 5 -8"></a-entity>
