<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Instancing + Fake Physics</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <script>
    AFRAME.registerPrimitive('a-blahblah', {
      defaultComponents: {
        geometry: { primitive: 'box', width: 8 },
        material: { color: 'blue' }
      },

      mappings: {
        height: 'geometry.height',
        depth: 'geometry.depth',
        color: 'material.color'
      }
    });
  </script>
</head>

<body>
  <a-scene background="color: #ECECEC">

    <!-- Now this works correctly -->
    <a-blahblah
      color="green"
      height="3"
      depth="4"
      position="0 1.5 -5">
    </a-blahblah>

    <a-camera position="0 1.6 0">
      
    </a-camera>

  </a-scene>
</body>
</html>
